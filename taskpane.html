<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="connect-src 'self'">
<title>Clinic Template Tool</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="dev-updates.css?v=1.2.1">
<style>
:root{
  --bg:#f4f5f2;--surface:#fdfdfb;--surface2:#ecefe9;--ink:#22262a;--muted:#62686e;--line:#dde1da;
  --accent:#1f6f6b;--accent-ink:#fff;--accent-soft:#dcefed;
  --ok:#2f7a45;--ok-soft:#e3f1e6;--warn:#9a6a0b;--warn-soft:#fbf0d6;--bad:#b3261e;--bad-soft:#fbe4e1;
  --s1:#2a78d6;--q1:#cde2fb;--q2:#9ec5f4;--q3:#6da7ec;--q4:#3987e5;--q5:#256abf;--q6:#184f95;--q7:#0d366b;
  --radius:12px;--shadow:0 1px 2px rgba(20,40,40,.06),0 2px 8px rgba(20,40,40,.05);--q-hi-ink:#fff;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  --bg:#171a1c;--surface:#202427;--surface2:#2a2f33;--ink:#e9ece8;--muted:#a3aaa6;--line:#363c40;
  --accent:#5cbcb4;--accent-ink:#10201f;--accent-soft:#1d3533;
  --ok:#7cc592;--ok-soft:#1f3326;--warn:#e3b75a;--warn-soft:#3a3020;--bad:#f08a80;--bad-soft:#3d2320;
  --s1:#3987e5;--q1:#1c2b3d;--q2:#184f95;--q3:#1c5cab;--q4:#256abf;--q5:#3987e5;--q6:#6da7ec;--q7:#9ec5f4;--q-hi-ink:#10201f;--bar:#184f95;--shadow:none}}
:root[data-theme="dark"]{--bg:#171a1c;--surface:#202427;--surface2:#2a2f33;--ink:#e9ece8;--muted:#a3aaa6;--line:#363c40;--accent:#5cbcb4;--accent-ink:#10201f;--accent-soft:#1d3533;--ok:#7cc592;--ok-soft:#1f3326;--warn:#e3b75a;--warn-soft:#3a3020;--bad:#f08a80;--bad-soft:#3d2320;--s1:#3987e5;--q1:#1c2b3d;--q2:#184f95;--q3:#1c5cab;--q4:#256abf;--q5:#3987e5;--q6:#6da7ec;--q7:#9ec5f4;--q-hi-ink:#10201f;--bar:#184f95;--shadow:none;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.brand .dot{width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.brand small{font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center;cursor:pointer;padding:0 8px}
.iconbtn:hover{border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;padding:7px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs button[disabled]{opacity:.45;cursor:default}
nav.tabs.sub{padding-top:0} nav.tabs.sub button{flex:0 0 auto;font-weight:500;padding:4px 10px}
nav.tabs.sub button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{padding:12px;max-width:1500px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1} .card h2 select{font-size:13px;font-weight:500}
.card h3{font-size:13px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.small{font-size:12.5px}.muted{color:var(--muted)}
/* 1.2.0 clinic file v2: visits here, card on file and OK to collect, history */
.pt ul.visits{list-style:none;margin:6px 0;padding:0;border-top:1px solid var(--line)}.pt ul.visits li{padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.pt .money{margin:6px 0}.pt .okc{gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}.pt .okc .chip{cursor:pointer}.pt .okc .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pt ul.hist li{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600;min-height:34px}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;padding:8px 12px 10px}
.filters label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);gap:2px}
.card h2 select,.filters input,.filters select,.fld input,.fld select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;min-height:30px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:22px;font-weight:700;line-height:1.2} .kpi .s{font-size:11.5px;color:var(--muted)}
.tw{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:0;top:4px;bottom:4px;background:var(--bar,var(--q1));border-radius:0 4px 4px 0;z-index:0}
.bar-cell span{position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:9px;border:1px solid transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mute{background:var(--surface2);color:var(--muted)}
.msg{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.info{background:var(--accent-soft);color:var(--ink)}
ul.ins{margin:4px 0 0;padding-left:18px} ul.ins li{margin:3px 0}
.heat td.h{text-align:center;min-width:44px;font-variant-numeric:tabular-nums;border:2px solid var(--surface);border-radius:6px;cursor:default}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ttl{font-weight:600;font-size:13px;margin-bottom:4px}
.tip{position:fixed;pointer-events:none;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);white-space:nowrap}
.cols{display:block} @media(min-width:1000px){.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}}
#modal{position:fixed;inset:0;background:rgba(10,20,20,.3);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);z-index:20;display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
#modal[hidden]{display:none}
#sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#sheet h2{margin-top:0;font-size:16px}
.fld{display:flex;flex-direction:column;gap:3px;margin:8px 0;font-size:12.5px;color:var(--muted)}
.fld input,.fld select{color:var(--ink);font-size:14px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{border-radius:10px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15);font-size:13px;max-width:90vw}
#busy{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,20,20,.18);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#busy[hidden]{display:none}
#busy div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600}
.legend{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:22px;height:10px;border-radius:3px}
/* Clinic Eligibility views */
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
button.chip{cursor:pointer;font-family:inherit} button.chip[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:90px;color:var(--ink);font-size:14px;resize:vertical}
.sesearch{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;min-height:32px;width:100%;margin-top:4px}
h3.day{font-size:12.5px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:flex;gap:6px;align-items:center}
.ptgrid{display:block} @media(min-width:820px){.ptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));column-gap:12px;align-items:start} .ptgrid h3.day{grid-column:1/-1}}
.pt{padding:10px 12px} .pt.hi{border-left:4px solid var(--bad)}
.pt-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap} .pt-h b{font-size:15px;letter-spacing:.3px}
.pt dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;margin:8px 0 4px;font-size:13px} .pt dt{color:var(--muted)} .pt dd{margin:0;overflow-wrap:anywhere}
.pt .chips{margin:5px 0 0}
ul.items{margin:6px 0 0;padding-left:18px;font-size:13px} ul.items li{margin:2px 0} ul.items li.sev-high b{color:var(--bad)} ul.items li.sev-medium b{color:var(--warn)}
.mrow{display:flex;gap:6px;align-items:center;font-size:12.5px;margin:2px 0;flex-wrap:wrap} .mrow .ml{min-width:72px;color:var(--muted)}
.meter{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;vertical-align:middle} .meter i{display:block;height:100%;background:var(--accent)}
.mrow.met .meter i{background:var(--ok)} .mrow.appr .meter i{background:var(--warn)}
table.ben td{white-space:normal;vertical-align:top} table.ben td:first-child{white-space:nowrap}
label.ck{display:flex;gap:6px;align-items:flex-start;font-size:13px;margin:4px 0;cursor:pointer} label.ck input{margin-top:3px;flex:none}
.task{display:flex;gap:6px;align-items:flex-start;margin:4px 0} .task label.ck{flex:1;min-width:0;margin:0} .task .btn{flex:none}
.tnote{margin:0 0 6px 20px;overflow-wrap:anywhere}
.pt-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
/* toolbar, flush right: refresh, full screen, light / dark (the IVK Tracker's: plain icons, 18px, a soft fill on hover) */
.tools{display:flex;align-items:center;gap:2px;flex:none}
.tools .iconbtn{position:relative;width:40px;height:40px;min-width:0;padding:0;border:0;border-radius:12px;background:none;color:var(--muted);transition:background .2s,color .2s}
.tools .iconbtn:hover{background:var(--surface2);color:var(--ink)}
/* light / dark: both symbols whole, the current one faded, the one to press in ink; they swap places on a change */
.tools .iconbtn.theme{width:auto;padding:0 8px;display:flex;align-items:center;gap:3px}
.iconbtn.theme svg{width:18px;height:18px}
.iconbtn.theme .tsl{font-size:14px;color:var(--line);line-height:1}
.iconbtn.theme .tcur{opacity:.45}
.iconbtn.theme .tgo{color:var(--ink)}
.iconbtn.theme .tcur,.iconbtn.theme .tgo{display:grid;place-items:center}
.iconbtn.theme.swap .tcur{animation:ctswapL .38s cubic-bezier(.3,.7,.3,1)}
.iconbtn.theme.swap .tgo{animation:ctswapR .38s cubic-bezier(.3,.7,.3,1)}
@keyframes ctswapL{from{transform:translateX(12px) rotate(-90deg);opacity:1}}
@keyframes ctswapR{from{transform:translateX(-12px) rotate(90deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){.iconbtn.theme.swap .tcur,.iconbtn.theme.swap .tgo{animation:none}}
/* toolbar hover labels: what the press does */
.tools .iconbtn[data-tip]:hover::after,.tools .iconbtn[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;white-space:nowrap;padding:5px 9px;border-radius:8px;background:var(--ink);color:var(--surface);font-size:12px;font-weight:500;line-height:1.2;pointer-events:none;z-index:60}
/* Dev Update bell (dev-updates.js / .css, shared): full screen only, at home right of the name (.du-home) */
.devupd{--font:"Segoe UI",system-ui,-apple-system,sans-serif;--surface-2:var(--line);--surface-3:var(--surface2);--danger:var(--bad);--danger-soft:var(--bad-soft)}
.brand .bname{overflow:hidden;text-overflow:ellipsis}
.brand .du-home{margin:-12px -4px -12px -6px}
/* who's using the tool, beside refresh */
.whoami{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;padding:0 10px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;line-height:1.15;max-width:120px;min-width:0;flex:none}
.whoami:hover{border-color:var(--accent)}
.whoami b{font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami small{font-size:11px;color:var(--muted)}
/* the loading screen on open, then "Enter your name" (the IVK Tracker's layout); a long list scrolls */
.boot{min-height:100vh;display:flex;overflow:auto;padding:24px}
.bootin{width:min(380px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.bootin h1{margin:22px 0 0;font-size:26px;line-height:1.2}.bootin>p{margin:6px 0 0;font-size:14px}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--surface2);border-top-color:var(--accent);animation:ctspin .9s linear infinite}
@keyframes ctspin{to{transform:rotate(360deg)}}
.steps{list-style:none;width:100%;margin:24px 0 0;padding:0;text-align:left}
.step{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.step .k{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--accent-ink)}
.step.done .k{background:var(--accent);border-color:var(--accent)}
.step.now .k{border-color:var(--ink)}
.step .t{font-size:14px}.step.next .t{color:var(--muted)}
.step .m{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;min-height:17px}
.boot.who .bootin{width:min(420px,100%)}
.whohero{display:flex;flex-direction:column;align-items:center}.whohero h1{margin:0}
.wholist{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:22px}
.wholist .whob{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:48px;font-size:16px;text-align:left}
.whob .tag{font-size:12px;font-weight:500;padding:3px 10px;border-radius:12px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.whonew{width:100%;margin-top:14px;text-align:left}
.whonew>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
@media(max-width:520px){.kpi .v{font-size:19px} th,td{padding:4px 6px}}
@media(max-width:700px){header.top{position:static}}   /* the filter row would cover a narrow task pane */
</style>
</head>
<body>
<div id="app"><main><div class="card">Loading…</div></main></div>
<div id="modal" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="busy" hidden><div id="busyMsg">Working…</div></div>
<div id="toast"></div>
<div id="tip" class="tip" hidden></div>
<script src="engine.js?v=1.2.1"></script>
<script src="cadence.js?v=1.2.1"></script>
<script src="payer-rules.js?v=1.2.1"></script>
<script src="core.js?v=1.2.1"></script>
<script src="rules.js?v=1.2.1"></script>
<script src="fees.js?v=1.2.1"></script>
<script src="pricing.js?v=1.2.1"></script>
<script src="lookup.js?v=1.2.1"></script>
<script src="dev-updates.js?v=1.2.1"></script>
<script src="app.js?v=1.2.1"></script>
</body>
</html>
